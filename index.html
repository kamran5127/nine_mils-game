<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Men's Morris - Real Money Gaming</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h2 { text-align: center; color: #38bdf8; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: #0284c7;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0369a1; }
        .hidden { display: none; }
        .wallet-box { background: #0f172a; padding: 15px; border-radius: 5px; text-align: center; margin-bottom: 15px; }
        .msg { text-align: center; font-size: 14px; margin-top: 5px; }
        
        /* Game Board Styling */
        #game-board {
            width: 300px;
            height: 300px;
            background: #334155;
            margin: 20px auto;
            position: relative;
            border: 2px solid #38bdf8;
        }
        .node {
            width: 25px;
            height: 25px;
            background: #94a3b8;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }
        .node.player1 { background: #ef4444; }
        .node.player2 { background: #4ade80; }
    </style>
</head>
<body>

    <h1>Nine Men's Morris Gaming</h1>

    <!-- Auth Section -->
    <div id="auth-container" class="container">
        <h2 id="form-title">Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleAuth()">Submit</button>
        <p class="msg" id="auth-msg"></p>
        <p style="text-align: center; cursor: pointer; color: #38bdf8;" onclick="toggleAuthMode()">Don't have an account? Sign up</p>
    </div>

    <!-- Dashboard & Deposit Section -->
    <div id="dashboard-container" class="container hidden">
        <h2>Player Dashboard</h2>
        <div class="wallet-box">
            <h3>Wallet Balance</h3>
            <p style="font-size: 24px; color: #4ade80;" id="user-balance">$0.00</p>
            <p id="welcome-user" style="color: #94a3b8;"></p>
        </div>

        <h3>Deposit Funds ($1 - $50,000)</h3>
        <select id="deposit-method">
            <option value="Easypaisa">Easypaisa</option>
            <option value="JazzCash">JazzCash</option>
            <option value="Bank">Bank Transfer</option>
        </select>
        <input type="number" id="deposit-amount" placeholder="Amount ($1 - $50,000)" min="1" max="50000">
        <input type="text" id="transaction-id" placeholder="Transaction ID / Receipt No">
        <button onclick="submitDeposit()">Submit Deposit Request</button>
        <p class="msg" id="deposit-msg"></p>

        <button style="background: #10b981; margin-top: 15px;" onclick="startMatchmaking()">Find Online Match</button>
        <button style="background: #ef4444; margin-top: 10px;" onclick="logout()">Logout</button>
    </div>

    <!-- Game Room Section -->
    <div id="game-container" class="container hidden">
        <h2>Multiplayer Game</h2>
        <p class="msg" id="game-status">Connecting...</p>
        <div id="game-board"></div>
        <button style="background: #ef4444;" onclick="leaveGame()">Exit Game</button>
    </div>

    <script>
        const socket = io();
        let isSignup = false;
        let loggedInUser = '';
        let currentRoom = '';

        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('form-title').innerText = isSignup ? 'Sign Up' : 'Login';
            document.getElementById('auth-msg').innerText = '';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isSignup ? '/api/signup' : '/api/login';

            if (!username || !password) {
                document.getElementById('auth-msg').innerText = 'Please fill all fields';
                document.getElementById('auth-msg').style.color = '#ef4444';
                return;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    if (isSignup) {
                        document.getElementById('auth-msg').innerText = 'Registered successfully! Please login.';
                        document.getElementById('auth-msg').style.color = '#4ade80';
                        toggleAuthMode();
                    } else {
                        loggedInUser = username;
                        document.getElementById('welcome-user').innerText = `Welcome, ${username}`;
                        document.getElementById('user-balance').innerText = `$${data.balance || 0}`;
                        document.getElementById('auth-container').classList.add('hidden');
                        document.getElementById('dashboard-container').classList.remove('hidden');
                    }
                } else {
                    document.getElementById('auth-msg').innerText = data.message || 'Error occurred';
                    document.getElementById('auth-msg').style.color = '#ef4444';
                }
            } catch (err) { console.error(err); }
        }

        async function submitDeposit() {
            const method = document.getElementById('deposit-method').value;
            const amount = Number(document.getElementById('deposit-amount').value);
            const transactionId = document.getElementById('transaction-id').value;
            const msgEl = document.getElementById('deposit-msg');

            if (!amount || !transactionId) {
                msgEl.innerText = 'Please enter amount and transaction ID';
                msgEl.style.color = '#ef4444';
                return;
            }

            try {
                const response = await fetch('/api/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: loggedInUser, method, amount, transactionId })
                });
                const data = await response.json();
                msgEl.innerText = data.message;
                msgEl.style.color = data.success ? '#4ade80' : '#ef4444';
            } catch (err) { console.error(err); }
        }

        function startMatchmaking() {
            document.getElementById('dashboard-container').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('game-status').innerText = 'Searching for an opponent...';
            socket.emit('find-game', loggedInUser);
        }

        socket.on('waiting', (msg) => {
            document.getElementById('game-status').innerText = msg;
        });

        socket.on('game-start', (data) => {
            currentRoom = data.room;
            document.getElementById('game-status').innerText = `Match Started! ${data.player1} vs ${data.player2}`;
            setupBoard();
        });

        function setupBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            // Simple visual nodes setup for test
            for (let i = 0; i < 9; i++) {
                const node = document.createElement('div');
                node.className = 'node';
                node.style.top = `${20 + (i * 30)}px`;
                node.style.left = `${20 + (i * 25)}px`;
                board.appendChild(node);
            }
        }

        function leaveGame() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('dashboard-container').classList.remove('hidden');
        }

        function logout() {
            loggedInUser = '';
            document.getElementById('dashboard-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
